<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELORA | Lamborghini Collection</title>
    <link rel="stylesheet" href="Lamborghini.css">
</head>
<body>

    <header>
        <div class="logo">VELORA</div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Lamborghini...">
        </div>
    </header>

    <section class="container">
        <div class="cars-grid" id="carsGrid">

            <div class="card">
                <img src="l1.webp" alt="Revuelto">
                <div class="card-content">
                    <h2>Lamborghini Revuelto</h2>
                    <p class="price">₹8.89 Crore</p>
                </div>
            </div>

            <div class="card">
                <img src="l2.webp" alt="Huracan STO">
                <div class="card-content">
                    <h2>Lamborghini Huracan STO</h2>
                    <p class="price">₹4.99 Crore</p>
                </div>
            </div>

            <div class="card">
                <img src="l3.jpg" alt="Aventador">
                <div class="card-content">
                    <h2>Lamborghini Aventador</h2>
                    <p class="price">₹6.25 Crore</p>
                </div>
            </div>

            <div class="card">
                <img src="l4.webp" alt="Urus">
                <div class="card-content">
                    <h2>Lamborghini Urus</h2>
                    <p class="price">₹4.18 Crore</p>
                </div>
            </div>

            <div class="card">
                <img src="l5.webp" alt="Sian">
                <div class="card-content">
                    <h2>Lamborghini Sian</h2>
                    <p class="price">₹9.50 Crore</p>
                </div>
            </div>

            <div class="card">
                <img src="l6.webp" alt="Countach">
                <div class="card-content">
                    <h2>Lamborghini Countach</h2>
                    <p class="price">₹8.00 Crore</p>
                </div>
            </div>

            <div class="card">
                <img src="l7.jpg" alt="Terzo Millennio">
                <div class="card-content">
                    <h2>Terzo Millennio</h2>
                    <p class="price">Concept Car</p>
                </div>
            </div>

            <div class="card">
                <img src="l8.webp" alt="Essenza SCV12">
                <div class="card-content">
                    <h2>Essenza SCV12</h2>
                    <p class="price">₹18 Crore</p>
                </div>
            </div>

        </div>
    </section>

    <script src="Lamborghini.js"></script>
</body>
</html>
