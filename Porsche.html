<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELORA | Porsche Collection</title>
<link rel="stylesheet" href="porsche.css">
</head>
<body>

<header>
    <h1>VELORA</h1>

    <input
        type="text"
        id="searchInput"
        placeholder="Search Porsche Car..."
        onkeyup="searchCars()"
    >
</header>

<section class="cars-container">

    <div class="card">
        <img src="p1.jpg" alt="">
        <div class="info">
            <h2>Porsche 911 Carrera</h2>
            <p>₹1.99 Crore</p>
        </div>
    </div>

    <div class="card">
        <img src="p2.jpg" alt="">
        <div class="info">
            <h2>Porsche 911 Turbo S</h2>
            <p>₹3.35 Crore</p>
        </div>
    </div>

    <div class="card">
        <img src="p3.jpg" alt="">
        <div class="info">
            <h2>Porsche Taycan</h2>
            <p>₹1.67 Crore</p>
        </div>
    </div>

    <div class="card">
        <img src="p4.webp" alt="">
        <div class="info">
            <h2>Porsche Macan</h2>
            <p>₹96 Lakh</p>
        </div>
    </div>

    <div class="card">
        <img src="p5.webp" alt="">
        <div class="info">
            <h2>Porsche Cayenne</h2>
            <p>₹1.42 Crore</p>
        </div>
    </div>

    <div class="card">
        <img src="p6.jpg" alt="">
        <div class="info">
            <h2>Porsche Panamera</h2>
            <p>₹1.80 Crore</p>
        </div>
    </div>

    <div class="card">
        <img src="p7.webp" alt="">
        <div class="info">
            <h2>Porsche 718 Cayman</h2>
            <p>₹1.48 Crore</p>
        </div>
    </div>

    <div class="card">
        <img src="p8.webp" alt="">
        <div class="info">
            <h2>Porsche 718 Boxster</h2>
            <p>₹1.52 Crore</p>
        </div>
    </div>

    <div class="card">
        <img src="p9.webp" alt="">
        <div class="info">
            <h2>Porsche GT3 RS</h2>
            <p>₹3.51 Crore</p>
        </div>
    </div>

</section>

<script src="porsche.js"></script>
</body>
</html>
